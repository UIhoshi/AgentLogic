name: Validate AgentLogic Package

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run full AgentLogic maintainer check and regression suite
        shell: pwsh
        run: |
          ./scripts/maintainer-check.ps1

      - name: Smoke-test Node.js cross-platform installer
        shell: pwsh
        run: |
          $tmpOut = [IO.Path]::Combine($env:RUNNER_TEMP, 'agentlogic-node-smoke', 'AGENTLOGIC.md')
          node ./scripts/install.js --host generic --target-path $tmpOut

      - name: Smoke-test install.sh on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          chmod +x ./install.sh
          ./install.sh --host generic --target-path "$RUNNER_TEMP/agentlogic-sh-smoke/AGENTLOGIC.md" --user-home "$RUNNER_TEMP/agentlogic-sh-home"
