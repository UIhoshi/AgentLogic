name: Validate AgentLogic Package

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run full AgentLogic maintainer check and regression suite
        shell: pwsh
        run: |
          ./scripts/maintainer-check.ps1

      - name: Smoke-test Node.js cross-platform installer
        shell: pwsh
        run: |
          $tmpOut = Join-Path $env:RUNNER_TEMP 'agentlogic-node-smoke\AGENTLOGIC.md'
          node ./scripts/install.js --host generic --target-path $tmpOut
